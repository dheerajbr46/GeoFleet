services:
  postgres:
    image: postgres:15-alpine
    container_name: geofleet-postgres
    environment:
      POSTGRES_DB: geofleet_rider
      POSTGRES_USER: geofleet
      POSTGRES_PASSWORD: geofleet
    ports:
      - "5442:5432"
    volumes:
      - geofleet-postgres15-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: geofleet-redis
    ports:
      - "6379:6379"
    volumes:
      - geofleet-redis-data:/data

volumes:
  geofleet-postgres15-data:
  geofleet-redis-data:
